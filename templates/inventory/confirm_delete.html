{% extends 'base/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-md mx-auto bg-white shadow-md rounded-md p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">{{ title }}</h1>
        
        <p class="text-gray-600 mb-6">Apakah Anda yakin ingin menghapus "{{ object }}"? Tindakan ini tidak dapat dibatalkan.</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="flex justify-end space-x-4">
                <a href="javascript:history.back()" class="bg-gray-500 hover:bg-gray-600 text-white py-2 px-4 rounded-md">
                    Batal
                </a>
                <button type="submit" class="bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded-md">
                    Hapus
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
